name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  linux:
    name: Linux tests and cross-platform builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: true
      - name: Enforce rule-based-only gateway dependencies
        run: python3 scripts/check_no_llm_dependencies.py
      - name: Reject obvious release secrets and artifacts
        run: python3 scripts/check_release_tree.py
      - name: Verify module checksums
        run: go mod verify
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test including races
        run: go test -count=1 -race ./...
      - name: Linux updater isolated fault scenarios
        run: python3 scripts/test_linux_update.py
      - name: Static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
      - name: Dependency vulnerability gate
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Source SBOM
        run: python3 scripts/generate_sbom.py > source-sbom.spdx.json
      - name: Cross-platform compilation
        shell: bash
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build ./cmd/gateway
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build ./cmd/uapctl
          done
      - name: Build release container image
        run: docker build -f deployments/docker/Dockerfile -t uwa-ci:${{ github.sha }} .
      - name: Scan release container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uwa-ci:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

  windows:
    name: Native Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache: true
      - name: Windows tests
        run: go test -count=1 ./...
      - name: Windows executable builds
        run: |
          go build -o gateway.exe ./cmd/gateway
          go build -o uapctl.exe ./cmd/uapctl
