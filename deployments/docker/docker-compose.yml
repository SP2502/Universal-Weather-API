version: '3.8'

services:
  gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - APP_ENV=development
      - APP_PORT=8080
      - APP_BIND_HOST=0.0.0.0
      - APP_LOG_LEVEL=INFO
      - APP_DB_DRIVER=postgres
      - APP_DATABASE_URL=postgres://uap_user:${UWA_POSTGRES_PASSWORD:?Set UWA_POSTGRES_PASSWORD}@postgres:5432/uap?sslmode=disable
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - WEATHERAPI_API_KEY=${WEATHERAPI_API_KEY:-}
      - LOCATIONIQ_API_KEY=${LOCATIONIQ_API_KEY:-}
      - APP_CACHE_DRIVER=redis
      - APP_REDIS_URL=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      - POSTGRES_USER=uap_user
      - POSTGRES_PASSWORD=${UWA_POSTGRES_PASSWORD:?Set UWA_POSTGRES_PASSWORD}
      - POSTGRES_DB=uap
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Gateway migrations are applied transactionally by the Go service.
      # Do not mount the legacy root SQL into initdb.d.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uap_user -d uap"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
