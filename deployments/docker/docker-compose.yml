services:
  gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "127.0.0.1:${UWA_GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      - APP_ENV=development
      - APP_PORT=8080
      - APP_BIND_HOST=0.0.0.0
      - APP_LOG_LEVEL=INFO
      - APP_DB_DRIVER=postgres
      - APP_DATABASE_URL=postgres://uap_user:${UWA_POSTGRES_PASSWORD:?Set UWA_POSTGRES_PASSWORD}@postgres:5432/uap?sslmode=disable
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - WEATHERAPI_API_KEY=${WEATHERAPI_API_KEY:-}
      - LOCATIONIQ_API_KEY=${LOCATIONIQ_API_KEY:-}
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY:-}
      - APP_DEPLOYMENT_USE=${APP_DEPLOYMENT_USE:-noncommercial}
      - APP_RELEASE_PROFILE=${APP_RELEASE_PROFILE:-lean_v1}
      - APP_PROVIDER_POLICY_FILE=/etc/uwa/provider-policy.json
      - APP_PROVIDER_QUOTAS_JSON=${APP_PROVIDER_QUOTAS_JSON:-}
      - APP_ENABLE_GEOAPIFY=${APP_ENABLE_GEOAPIFY:-false}
      - APP_ENABLE_MET_NORWAY=${APP_ENABLE_MET_NORWAY:-false}
      - APP_MET_NORWAY_USER_AGENT=${APP_MET_NORWAY_USER_AGENT:-}
      - APP_ENABLE_OPEN_METEO_FORECAST=${APP_ENABLE_OPEN_METEO_FORECAST:-false}
      - APP_ENABLE_OPEN_METEO_GEOCODING=${APP_ENABLE_OPEN_METEO_GEOCODING:-false}
      - APP_ENABLE_OPEN_METEO_AIR_QUALITY=${APP_ENABLE_OPEN_METEO_AIR_QUALITY:-false}
      - APP_ENABLE_OPEN_METEO_HISTORY=${APP_ENABLE_OPEN_METEO_HISTORY:-false}
      - APP_ENABLE_OPEN_METEO_MARINE=${APP_ENABLE_OPEN_METEO_MARINE:-false}
      - APP_ENABLE_SUNRISE_SUNSET=${APP_ENABLE_SUNRISE_SUNSET:-false}
      - APP_ENABLE_US_NWS=${APP_ENABLE_US_NWS:-false}
      - APP_ENABLE_US_NWS_ALERTS=${APP_ENABLE_US_NWS_ALERTS:-false}
      - APP_ENABLE_BRIGHT_SKY=${APP_ENABLE_BRIGHT_SKY:-false}
      - APP_NWS_USER_AGENT=${APP_NWS_USER_AGENT:-}
      - APP_COUNTRY_POLYGONS_FILE=${APP_COUNTRY_POLYGONS_FILE:-}
      - APP_CACHE_DRIVER=redis
      - APP_REDIS_URL=redis:6379
    volumes:
      - ${UWA_PROVIDER_POLICY_HOST_FILE:-../../configs/provider-policy.example.json}:/etc/uwa/provider-policy.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      - POSTGRES_USER=uap_user
      - POSTGRES_PASSWORD=${UWA_POSTGRES_PASSWORD:?Set UWA_POSTGRES_PASSWORD}
      - POSTGRES_DB=uap
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Gateway migrations are applied transactionally by the Go service.
      # Do not mount the legacy root SQL into initdb.d.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uap_user -d uap"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
